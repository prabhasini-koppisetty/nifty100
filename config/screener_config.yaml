# Screener Configuration File for Nifty 100 Financial Intelligence Platform
# Analyst-Editable Criteria and Metric Specifications

metrics:
  roe_min:
    field: "return_on_equity_pct"
    description: "Minimum Return on Equity (%)"
    type: "min"
  de_max:
    field: "debt_to_equity"
    description: "Maximum Debt to Equity Ratio"
    type: "max"
  fcf_min:
    field: "free_cash_flow_cr"
    description: "Minimum Free Cash Flow (₹ Cr)"
    type: "min"
  revenue_cagr_5yr_min:
    field: "revenue_cagr_5yr"
    description: "Minimum 5-Year Revenue CAGR (%)"
    type: "min"
  pat_cagr_5yr_min:
    field: "pat_cagr_5yr"
    description: "Minimum 5-Year PAT CAGR (%)"
    type: "min"
  opm_min:
    field: "operating_profit_margin_pct"
    description: "Minimum Operating Profit Margin (%)"
    type: "min"
  pe_max:
    field: "pe_ratio"
    description: "Maximum Price to Earnings Ratio"
    type: "max"
  pb_max:
    field: "pb_ratio"
    description: "Maximum Price to Book Ratio"
    type: "max"
  dividend_yield_min:
    field: "dividend_yield_pct"
    description: "Minimum Dividend Yield (%)"
    type: "min"
  icr_min:
    field: "interest_coverage"
    description: "Minimum Interest Coverage Ratio"
    type: "min"
  market_cap_min:
    field: "market_cap_crore"
    description: "Minimum Market Capitalization (₹ Cr)"
    type: "min"
  net_profit_min:
    field: "net_profit"
    description: "Minimum Net Profit (₹ Cr)"
    type: "min"
  eps_cagr_min:
    field: "eps_cagr_5yr"
    description: "Minimum 5-Year EPS CAGR (%)"
    type: "min"
  asset_turnover_min:
    field: "asset_turnover"
    description: "Minimum Asset Turnover Ratio"
    type: "min"
  sales_min:
    field: "sales"
    description: "Minimum Sales / Revenue (₹ Cr)"
    type: "min"

presets:
  quality_compounder:
    name: "Quality Compounder"
    description: "High ROE, low leverage, positive FCF, and strong 5-year revenue growth."
    criteria:
      return_on_equity_pct_min: 15.0
      debt_to_equity_max: 1.0
      free_cash_flow_cr_min: 0.0
      revenue_cagr_5yr_min: 10.0

  value_pick:
    name: "Value Pick"
    description: "Undervalued stocks with reasonable leverage and dividend yield."
    criteria:
      pe_ratio_max: 20.0
      pb_ratio_max: 3.0
      debt_to_equity_max: 2.0
      dividend_yield_pct_min: 1.0

  growth_accelerator:
    name: "Growth Accelerator"
    description: "High earnings and revenue growth with manageable leverage."
    criteria:
      pat_cagr_5yr_min: 20.0
      revenue_cagr_5yr_min: 15.0
      debt_to_equity_max: 2.0

  dividend_champion:
    name: "Dividend Champion"
    description: "Attractive dividend yield backed by conservative payout and positive cash flow."
    criteria:
      dividend_yield_pct_min: 2.0
      dividend_payout_ratio_pct_max: 80.0
      free_cash_flow_cr_min: 0.0

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    description: "Zero debt, healthy return on equity, and large scale sales."
    criteria:
      debt_to_equity_max: 0.0
      return_on_equity_pct_min: 12.0
      sales_min: 5000.0

  turnaround_watch:
    name: "Turnaround Watch"
    description: "Improving 3-year revenue growth, positive FCF, and declining debt."
    criteria:
      revenue_cagr_3yr_min: 10.0
      fcf_positive_latest: true
      de_declining_yoy: true
